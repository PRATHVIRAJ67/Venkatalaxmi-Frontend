  <!-- SPA Redirect Handler for Vercel and other platforms -->
  <script>
    // Enhanced SPA routing redirect handler
    (function () {
      // Check if we have a stored path from the 404.html handler
      var redirectPath = sessionStorage.getItem('redirectPath');
      if (redirectPath) {
        // Clear the storage
        sessionStorage.removeItem('redirectPath');

        // Only redirect if we're at the root path (to avoid redirect loops)
        if (window.location.pathname === '/' && !window.location.search && !window.location.hash) {
          // Use history API to avoid another page load
          window.history.replaceState(null, null, redirectPath);
        }
      }

      // Legacy GitHub Pages redirect handler
      if (window.location.search && window.location.search[1] === '/') {
        var decoded = window.location.search.slice(1);
        window.history.replaceState(null, null, decoded);
      }
    })();
  </script>

  <!-- Connection error handling script -->
  <script>
    // This script helps handle network errors and retry loading assets
    window.addEventListener('error', function (event) {
      if (event.target && (event.target.src || event.target.href)) {
        var resource = event.target.src || event.target.href;

        // Only handle asset loading errors
        if (resource.includes('/assets/') && !window.__assetRetries) {
          window.__assetRetries = window.__assetRetries || {};

          // Try to reload the resource if we haven't tried too many times
          if (!window.__assetRetries[resource] || window.__assetRetries[resource] < 3) {
            window.__assetRetries[resource] = (window.__assetRetries[resource] || 0) + 1;

            console.log('Retrying asset:', resource);

            // For scripts
            if (event.target.tagName.toLowerCase() === 'script') {
              var newScript = document.createElement('script');
              newScript.src = resource + '?retry=' + Date.now();
              newScript.async = event.target.async;
              newScript.defer = event.target.defer;
              event.target.parentNode.replaceChild(newScript, event.target);
            }

            // For stylesheets
            if (event.target.tagName.toLowerCase() === 'link' && event.target.rel === 'stylesheet') {
              var newLink = document.createElement('link');
              newLink.href = resource + '?retry=' + Date.now();
              newLink.rel = 'stylesheet';
              event.target.parentNode.replaceChild(newLink, event.target);
            }

            // For images and other resources, we could reload them too
          }
        }
      }
    }, true); // Capture phase to catch all events
  </script>
