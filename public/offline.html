<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - Venkatalakshmi Mess</title>
  <style>
    body {
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      background-color: #f8f9fa;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    
    .container {
      max-width: 600px;
      padding: 30px;
      background-color: white;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }
    
    .logo {
      width: 150px;
      margin-bottom: 20px;
    }
    
    h1 {
      color: #ce1212;
      margin-bottom: 20px;
      font-weight: 600;
    }
    
    p {
      margin-bottom: 20px;
      line-height: 1.6;
      color: #555;
    }
    
    .button {
      display: inline-block;
      background-color: #ce1212;
      color: white;
      padding: 12px 25px;
      border-radius: 50px;
      text-decoration: none;
      font-weight: 500;
      transition: all 0.3s ease;
      margin-top: 10px;
      border: none;
      cursor: pointer;
    }
    
    .button:hover {
      background-color: #aa0f0f;
      transform: translateY(-2px);
    }
    
    .offline-icon {
      font-size: 60px;
      margin-bottom: 20px;
      color: #ce1212;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="/Venkatalakshmi-Logo.png" alt="Venkatalakshmi Mess Logo" class="logo">
    <div class="offline-icon">📶</div>
    <h1>You're Offline</h1>
    <p>It seems you're currently offline. Please check your internet connection to access Venkatalakshmi Mess's delicious South Indian cuisine.</p>
    <p>We're saving your cart and preferences, so don't worry! Once you're back online, you can continue ordering your favorite dishes.</p>
    <button class="button" onclick="tryReconnecting()">Try Again</button>
  </div>

  <script>
    function tryReconnecting() {
      // Try to reload the page
      window.location.reload();
    }

    // Check if online status changes
    window.addEventListener('online', () => {
      window.location.reload();
    });
  </script>
</body>
</html>
